# Builds and tests CPPFX on Linux and Windows, and publishes a draft
# release when a version tag is pushed.
#
# Lives at .github/workflows/build.yml - the path is not optional, GitHub
# only looks there. Nothing to run by hand: push the file and it runs on
# that push and every one after. Results are under the Actions tab.
#
# To cut a release:
#     git tag v0.12.0
#     git push origin v0.12.0

name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore:          # doc-only pushes don't need a build
      - '**.md'
      - 'LICENSE'
  pull_request:
  workflow_dispatch:       # adds a "Run workflow" button

jobs:
  build:
    strategy:
      # Don't cancel the other platform when one fails - you want both results.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows-mingw64

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      # Clones the repo into the runner. Only what is committed exists here -
      # anything gitignored is simply not present.
      - uses: actions/checkout@v4

      # raylib compiles against X11/OpenGL/ALSA headers, which a bare Ubuntu
      # runner does not ship. Windows runners need nothing extra.
      - name: Install raylib build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev \
            libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev \
            libxinerama-dev libwayland-dev libxkbcommon-dev

      # Keeps the downloaded and built raylib between runs. The key includes
      # a hash of CMakeLists.txt, so changing the build config rebuilds it.
      - name: Cache raylib build
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ matrix.name }}-raylib60-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      # The Windows runner has MSVC installed and CMake would prefer it.
      # Force mingw-w64 GCC, which is what the README tells users to use and
      # what the shipped .a has to match.
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: >
          cmake -B build -G "MinGW Makefiles"
          -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          -DCMAKE_BUILD_TYPE=Release

      # Builds the library, the tests and the examples.
      - name: Build
        run: cmake --build build --config Release -j

      # Runs cppfx_tests. --output-on-failure prints what failed instead of
      # just saying a test failed. Colour needs no window, so this is safe
      # on a headless runner.
      - name: Test
        run: ctest --test-dir build --output-on-failure

      # Assembles the release tree: include/CPPFX/*.hpp, lib/libCPPFX.a,
      # README and LICENSE. --component cppfx excludes raylib's own files.
      - name: Stage release tree
        run: cmake --install build --prefix release/CPPFX --component cppfx

      # Downloadable from the bottom of the run's summary page, and picked
      # up by the release job below.
      - uses: actions/upload-artifact@v4
        with:
          name: CPPFX-${{ matrix.name }}
          path: release/

  # Runs only for tags starting with v, and only once both builds above
  # have passed - a failing test blocks the release.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # required to create the release
    steps:
      # Pulls both artifacts into artifacts/CPPFX-linux/ and
      # artifacts/CPPFX-windows-mingw64/, each holding a CPPFX folder.
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Renames the inner folder to match the archive, so extracting gives
      # one clearly-named directory rather than a generic CPPFX.
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist

          linux="CPPFX-${version}-linux-x86_64"
          cd artifacts/CPPFX-linux
          mv CPPFX "$linux"
          tar czf "../../dist/${linux}.tar.gz" "$linux"

          windows="CPPFX-${version}-windows-mingw64"
          cd ../CPPFX-windows-mingw64
          mv CPPFX "$windows"
          zip -qr "../../dist/${windows}.zip" "$windows"

      # draft: true means it does not go public until you press Publish -
      # you get to check the files and edit the notes first.
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          generate_release_notes: true
